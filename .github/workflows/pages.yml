name: Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build project site
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: JavaScript tests
        run: |
          set -o pipefail
          npm test -- --test-reporter tap > js-tests.tap 2>&1
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const text = fs.readFileSync('js-tests.tap', 'utf8');
          const lines = text.split(String.fromCharCode(10));
          const value = (label) => {
            const prefix = '# ' + label + ' ';
            const found = lines.find((item) => item.startsWith(prefix));
            return found ? found.slice(prefix.length).trim() : '';
          };
          if (value('tests') !== '78' || value('pass') !== '78' || value('fail') !== '0') {
            process.exit(1);
          }
          EOF

      - name: Python contract tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v > py-tests.txt 2>&1
          grep -q '^Ran 41 tests' py-tests.txt
          tail -n 5 py-tests.txt | grep -qx OK

      - name: Build with the project-site base
        run: |
          npm run build:pages
          test -f dist-pages/index.html
          grep -q '/releaseproof/assets/' dist-pages/index.html
          if grep -q 'sales136152' dist-pages/index.html; then
            echo 'The Pages bundle must not reference the existing host.'
            exit 1
          fi
          rm -rf _pages
          mkdir _pages
          cp -a dist-pages/. _pages/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    name: deploy project site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
